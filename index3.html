<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bootstrap Image Slider</title>
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      background-color: #f8f9fa;
    }
    h1 {
      text-align: center;
      margin: 30px 0;
      color: #343a40;
    }
    .carousel-container {
      max-width: 800px;
      margin: 0 auto 50px auto;
    }
    .carousel-item img {
      width: 100%;
      height: 450px;
      object-fit: cover;
      border-radius: 10px;
    }
    .carousel-caption {
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      padding: 10px 20px;
    }
  </style>
</head>
<body>

  <h1>🖼️ Simple Image Slider</h1>

  <div class="carousel-container">
    <div id="imageSlider" class="carousel slide" data-bs-ride="carousel">

      <!-- Indicators -->
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#imageSlider" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#imageSlider" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#imageSlider" data-bs-slide-to="2" aria-label="Slide 3"></button>
        <button type="button" data-bs-target="#imageSlider" data-bs-slide-to="3" aria-label="Slide 4"></button>
      </div>

      <!-- Slides -->
      <div class="carousel-inner rounded">

        <div class="carousel-item active">
          <img src="https://picsum.photos/seed/nature/800/450" alt="Nature" />
          <div class="carousel-caption d-none d-md-block">
            <h5>Nature</h5>
            <p>Beautiful nature scenery from around the world.</p>
          </div>
        </div>

        <div class="carousel-item">
          <img src="https://picsum.photos/seed/city/800/450" alt="City" />
          <div class="carousel-caption d-none d-md-block">
            <h5>City Life</h5>
            <p>Explore stunning cityscapes and urban landscapes.</p>
          </div>
        </div>

        <div class="carousel-item">
          <img src="https://picsum.photos/seed/mountains/800/450" alt="Mountains" />
          <div class="carousel-caption d-none d-md-block">
            <h5>Mountains</h5>
            <p>Majestic mountain views that take your breath away.</p>
          </div>
        </div>

        <div class="carousel-item">
          <img src="https://picsum.photos/seed/ocean/800/450" alt="Ocean" />
          <div class="carousel-caption d-none d-md-block">
            <h5>Ocean</h5>
            <p>Peaceful ocean views and serene beach scenes.</p>
          </div>
        </div>

      </div>

      <!-- Controls -->
      <button class="carousel-control-prev" type="button" data-bs-target="#imageSlider" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#imageSlider" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
